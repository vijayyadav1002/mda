<main class="w-full max-w-lg relative">
<!-- Tonal Layering: Surface-Container-Lowest card on Surface background -->
<div class="bg-surface-container-lowest rounded-xl p-8 md:p-12 text-center shadow-sm flex flex-col items-center">

<span class="material-symbols-outlined text-4xl" data-icon="logout">logout</span>
</div>
<!-- Header Typography: Editorial Headline -->
<h1 class="font-headline text-3xl font-extrabold tracking-tighter text-on-surface mb-3 leading-tight">
                Securely signing out?
            </h1>
<!-- Body Content: Clear messaging about unsaved changes -->
<p class="text-on-surface-variant font-medium text-base mb-10 max-w-sm mx-auto leading-relaxed">
                Before you leave, please ensure all your gallery edits are saved. You will need to sign in again to access your media library.
            </p>
<!-- Buttons & Actions -->
<div class="flex flex-col sm:flex-row-reverse gap-4 w-full">
<!-- Primary Action: Confirm Logout -->
<button class="flex-1 indigo-gradient text-white font-bold py-4 px-6 rounded-lg shadow-lg shadow-indigo-500/20 active:scale-95 transition-all duration-200 text-sm tracking-wide">
                    Confirm Logout
                </button>
<!-- Secondary Action: Return to Dashboard -->
<button class="flex-1 bg-surface-container-high text-primary font-bold py-4 px-6 rounded-lg hover:bg-surface-container-highest active:scale-95 transition-all duration-200 text-sm tracking-wide">
                    Return to Dashboard
                </button>
</div>
<!-- Metadata Label: Editorial/Archival Style -->
<div class="mt-12 pt-8 border-t border-outline-variant/20 w-full">
<span class="font-label text-[10px] uppercase tracking-[0.2em] text-outline font-bold">
                    The Curated Gallery • Session Security
                </span>
</div>
</div>
<!-- Background Aesthetic Element: Soft gradient glass circle for depth -->
<div class="absolute -z-10 -top-12 -right-12 w-48 h-48 bg-indigo-200/20 rounded-full blur-3xl"></div>
